name: Validate workflow documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check Markdown structure, file links and anchors
        shell: pwsh
        run: ./scripts/validate-workflow.ps1
      - name: Exercise validator regression cases
        shell: pwsh
        run: ./scripts/test-validate-workflow.ps1 -ScratchRoot '${{ runner.temp }}'
